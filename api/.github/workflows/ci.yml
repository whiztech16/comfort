name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so new advisories are caught even without pushes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comfort_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      PORT: "3000"
      TRUST_PROXY: "1"
      LOG_LEVEL: warn
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comfort_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/comfort_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/comfort_test
      FRONTEND_URL: http://localhost:5173
      JWT_ISSUER: comfort-api
      JWT_AUDIENCE: comfort-web
      ACCESS_TOKEN_TTL_MINUTES: "15"
      REFRESH_TOKEN_TTL_DAYS: "30"
      REFRESH_COOKIE_NAME: comfort_rt
      AT_REST_ACTIVE_KEY_VERSION: "1"
      GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
      EMAIL_HOST: localhost
      EMAIL_PORT: "587"
      EMAIL_USER: test
      EMAIL_PASSWORD: test
      EMAIL_FROM: test@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate throwaway secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AT_REST_KEY_V1=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t comfort-api:ci .
      - name: Image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id comfort-api:ci -u)
          echo "uid=$uid"
          test "$uid" != "0"